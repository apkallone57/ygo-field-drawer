<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>游戏王 · 随机抽字段</title>
<style>
  :root {
    --bg: #0d0a1a;
    --panel: #1a1430;
    --panel-2: #241b45;
    --gold: #e8c35a;
    --gold-2: #f5d97e;
    --text: #efe9dc;
    --dim: #9b92b5;
    --accent: #8a6ff0;
    --danger: #e06c75;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(138,111,240,.25), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(232,195,90,.12), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 28px; }
  h1 {
    font-size: 30px; letter-spacing: 4px;
    background: linear-gradient(180deg, var(--gold-2), var(--gold) 55%, #b98f2e);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 30px rgba(232,195,90,.25);
    font-family: "Source Han Serif SC", "Noto Serif SC", "STZhongsong", serif;
  }
  header p { color: var(--dim); margin-top: 8px; font-size: 14px; letter-spacing: 1px; }

  .panel {
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid rgba(232,195,90,.25);
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
  }
  .row { display: flex; gap: 10px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
  .row label { min-width: 88px; color: var(--dim); font-size: 14px; }
  input[type="text"], input[type="number"], select {
    background: #0f0b20; color: var(--text);
    border: 1px solid #3a2f66; border-radius: 8px;
    padding: 8px 10px; font-size: 15px; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input[type="number"] { width: 84px; }
  .hint { color: #6f668f; font-size: 12px; line-height: 1.7; margin-top: 6px; }
  .btn {
    cursor: pointer; border: none; border-radius: 9px;
    font-size: 15px; padding: 9px 16px; color: #241b45;
    background: linear-gradient(180deg, var(--gold-2), var(--gold));
    font-weight: bold; letter-spacing: 1px;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(232,195,90,.35); }
  .btn:active { transform: translateY(0); }
  .btn.ghost {
    background: transparent; color: var(--gold);
    border: 1px solid rgba(232,195,90,.5); font-weight: normal;
  }
  .btn.small { padding: 7px 12px; font-size: 13px; }
  .btn:disabled { opacity: .35; cursor: not-allowed; transform: none; box-shadow: none; }

  .draw-area { text-align: center; margin: 26px 0 10px; }
  #btn-draw {
    font-size: 22px; padding: 14px 64px; border-radius: 999px;
    letter-spacing: 10px; text-indent: 10px;
    background: linear-gradient(180deg, #ffe9a3, var(--gold) 45%, #b98f2e);
    box-shadow: 0 8px 30px rgba(232,195,90,.4), inset 0 1px 0 rgba(255,255,255,.6);
  }

  #result { margin-top: 24px; display: none; }
  .cards { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  .card {
    width: 148px; min-height: 170px;
    background: linear-gradient(160deg, #2c2158, #17102e 60%);
    border: 1px solid rgba(232,195,90,.45);
    border-radius: 12px;
    padding: 14px 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    animation: pop .5s cubic-bezier(.2,1.4,.4,1) backwards;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  .card::before {
    content: "✦"; position: absolute; top: 8px; left: 12px;
    color: rgba(232,195,90,.5); font-size: 12px;
  }
  .card .num {
    position: absolute; top: 10px; right: 10px;
    font-size: 12px; color: var(--gold); opacity: .9;
  }
  .card .name {
    font-size: 21px; font-weight: bold; color: var(--gold-2);
    text-align: center; line-height: 1.35; margin-bottom: 10px;
    font-family: "Source Han Serif SC", "Noto Serif SC", "STZhongsong", serif;
    word-break: keep-all;
  }
  .card .count {
    font-size: 12px; color: var(--dim);
    border: 1px solid #3a2f66; border-radius: 999px; padding: 3px 10px;
  }
  .card .kill {
    position: absolute; bottom: 8px; right: 10px;
    background: none; border: none; cursor: pointer;
    color: #8a7fae; font-size: 14px; opacity: 0; transition: opacity .15s;
  }
  .card:hover .kill { opacity: 1; }
  .card .kill:hover { color: var(--danger); }
  #block-panel { margin-top: 12px; border-top: 1px dashed #3a2f66; padding-top: 12px; }
  #block-list { margin: 8px 0 4px; }
  #block-list .empty { color: #6f668f; font-size: 12px; }
  .block-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: #0f0b20; border: 1px solid #3a2f66; border-radius: 999px;
    padding: 4px 10px; font-size: 13px; margin: 3px 4px 3px 0;
  }
  .block-chip button {
    background: none; border: none; cursor: pointer;
    color: var(--danger); font-size: 13px; padding: 0; line-height: 1;
  }
  @keyframes pop {
    0% { transform: rotateY(90deg) scale(.7); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }
  .result-bar {
    text-align: center; margin: 22px 0 6px;
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
  }
  #redraw-info { text-align: center; color: var(--dim); font-size: 13px; margin-bottom: 8px; }

  footer {
    margin-top: 40px; text-align: center;
    color: #5d5480; font-size: 12px; line-height: 1.8;
  }
  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(20px);
    background: #241b45; color: var(--text);
    border: 1px solid rgba(232,195,90,.4); border-radius: 999px;
    padding: 10px 22px; font-size: 14px; opacity: 0; pointer-events: none;
    transition: all .25s ease; z-index: 99;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 480px) {
    h1 { font-size: 24px; }
    .card { width: 40vw; min-height: 0; padding: 16px 6px; }
    .card .name { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>游戏王 · 随机抽字段</h1>
    <p>和朋友各抽几个字段，围绕它们组一副卡组吧</p>
  </header>

  <div class="panel">
    <div class="row">
      <label for="room">房间号</label>
      <input type="text" id="room" maxlength="16" placeholder="留空=各自独立随机" autocomplete="off">
      <button class="btn ghost small" id="btn-room">🎲 生成</button>
      <button class="btn ghost small" id="btn-room-copy">复制</button>
    </div>
    <div class="row">
      <label for="count">抽取数量</label>
      <input type="number" id="count" min="1" max="8" value="3">
    </div>
    <div class="row">
      <label for="min">字段卡数下限</label>
      <select id="min">
        <option value="0">不限</option>
        <option value="5">≥ 5 张</option>
        <option value="10" selected>≥ 10 张</option>
        <option value="20">≥ 20 张</option>
        <option value="30">≥ 30 张</option>
      </select>
    </div>
    <div class="row">
      <label for="redraw">重抽次数上限</label>
      <select id="redraw">
        <option value="0">不限</option>
        <option value="1">1 次</option>
        <option value="2">2 次</option>
        <option value="3" selected>3 次</option>
        <option value="5">5 次</option>
      </select>
    </div>
    <div class="hint">
      房间号留空时各自独立随机；填写后，<b>相同房间号 + 相同重抽进度 + 相同设置</b>的人会抽到完全一样的结果。
      房间号与设置发群里，大家就能抽同一批字段。
    </div>
    <div class="row" style="margin-top:14px">
      <label>屏蔽字段</label>
      <button class="btn ghost small" id="btn-block">🚫 屏蔽列表（0）</button>
      <span class="hint" style="margin:0">屏蔽太强力的字段后不再抽出</span>
    </div>
    <div id="block-panel" style="display:none">
      <div class="row" style="margin-top:2px">
        <input type="text" id="block-add" placeholder="输入字段名（可一次粘贴多个，用、逗号或换行分隔）" style="flex:1;min-width:160px" autocomplete="off">
        <button class="btn ghost small" id="btn-block-copy">复制</button>
        <button class="btn ghost small" id="btn-block-paste">粘贴导入</button>
        <button class="btn ghost small" id="btn-block-clear">清空</button>
      </div>
      <div id="block-list"></div>
      <div class="hint">
        屏蔽列表只保存在本机浏览器；抽到的字段卡上悬停可点 ✕ 快捷屏蔽。
        屏蔽会改变随机池——用房间号同步时，双方屏蔽表需一致（点「复制」发给他「粘贴导入」即可）。
      </div>
    </div>
  </div>

  <div class="draw-area">
    <button class="btn" id="btn-draw">抽！</button>
  </div>

  <div id="result">
    <div class="cards" id="cards"></div>
    <div id="redraw-info"></div>
    <div class="result-bar">
      <button class="btn ghost" id="btn-redraw">🔄 重抽</button>
      <button class="btn ghost" id="btn-copy">📋 复制战报</button>
    </div>
  </div>

  <footer>
    数据来源：百鸽 ygocdb.com 全量卡表 + YGOPro 字段表（共 586 个字段，2026-11）<br>
    单文件本地运行，无需联网 · 卡数含该字段的怪兽/魔法/陷阱
  </footer>
</div>
<div class="toast" id="toast"></div>

/* ---------- 工具 ---------- */
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1800);
}
function copyText(text, okMsg) {
  const done = () => toast(okMsg);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); }
  catch (e) { toast('复制失败，请手动复制'); }
  document.body.removeChild(ta);
}

/* ---------- 可复现随机数 ---------- */
function xmur3(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function () {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^= h >>> 16) >>> 0;
  };
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rngFor(room, step) { return mulberry32(xmur3(room + '::' + step)()); }

/* ---------- 屏蔽列表 ---------- */
const BL_KEY = 'ygo-field-blocklist';
let blocklist = new Set();
function loadBlocklist() {
  try {
    const arr = JSON.parse(localStorage.getItem(BL_KEY) || '[]');
    if (Array.isArray(arr)) arr.forEach(n => blocklist.add(n));
  } catch (e) {}
}
function saveBlocklist() {
  try { localStorage.setItem(BL_KEY, JSON.stringify([...blocklist])); } catch (e) {}
}
function addBlock(names) {
  let added = 0;
  names.forEach(n => {
    const v = n.trim();
    if (v && FIELDS.some(f => f.name === v) && !blocklist.has(v)) { blocklist.add(v); added++; }
  });
  if (added) { saveBlocklist(); renderBlocklist(); }
  return added;
}

    const chip = document.createElement('span');

    const t = document.createElement('span');
    t.textContent = name;
    const del = document.createElement('button');
    del.textContent = '✕';
    del.title = '取消屏蔽 ' + name;
    del.addEventListener('click', () => {
      blocklist.delete(name);
      saveBlocklist();
      renderBlocklist();
    });
    chip.appendChild(t);
    chip.appendChild(del);
    box.appendChild(chip);
  });
}
function parseBlockText(text) {
  return text.split(/[、,，;；\n\r]+/).map(s => s.trim()).filter(Boolean);
}

/* ---------- 抽取 ---------- */
function getSettings() {
  return {
    count: Math.min(8, Math.max(1, parseInt(document.getElementById('count').value, 10) || 3)),
    min: parseInt(document.getElementById('min').value, 10) || 0,
    redrawLimit: parseInt(document.getElementById('redraw').value, 10) || 0,
  };
}
function saveSettings() {
  try { localStorage.setItem('ygo-field-drawer', JSON.stringify(getSettings())); } catch (e) {}
}
function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('ygo-field-drawer') || 'null');
    if (!s) return;
    if (s.count) document.getElementById('count').value = s.count;
    if (s.min !== undefined) document.getElementById('min').value = s.min;
    if (s.redrawLimit !== undefined) document.getElementById('redraw').value = s.redrawLimit;
  } catch (e) {}
}
function poolFor(min) { return FIELDS.filter(f => f.n >= min && !blocklist.has(f.name)); }

function doDraw(step) {
  const s = getSettings();
  saveSettings();
  const pool = poolFor(s.min);
  if (pool.length === 0) { toast('当前下限下没有可用字段，请调低下限'); return false; }
  if (pool.length < s.count) {
    toast('池子里只剩 ' + pool.length + ' 个字段，就抽这么多啦');
  }
  const n = Math.min(s.count, pool.length);
  let room = document.getElementById('room').value.trim();
  if (!room) {
    // 独立随机：每次生成一个一次性种子
    room = 'solo-' + Math.random().toString(36).slice(2, 10);
    current = { solo: true, room: '' };
  } else {
    current = { solo: false, room: room };
  }
  const rng = rngFor(current.solo ? room : (current.room + '::' + step), step);
  // Fisher-Yates 洗牌取前 n 个
  const idx = pool.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  current.fields = idx.slice(0, n).map(i => pool[i]);
  current.step = step;
  return true;
}

function render() {
  const box = document.getElementById('cards');
  box.innerHTML = '';
  current.fields.forEach((f, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.style.animationDelay = (i * 0.12) + 's';
    el.innerHTML =
      '<span class="num">#' + (i + 1) + '</span>' +
      '<span class="name">' + escapeHtml(f.name) + '</span>' +
      '<span class="count">' + f.n + ' 张卡</span>' +
      '<button class="kill" title="屏蔽「' + escapeHtml(f.name) + '」（太强了！）">✕</button>';
    el.querySelector('.kill').addEventListener('click', () => {
      blocklist.add(f.name);
      saveBlocklist();
      renderBlocklist();
      toast('已屏蔽「' + f.name + '」，下次抽取起生效，点重抽立换');
    });
    box.appendChild(el);
  });
  document.getElementById('result').style.display = 'block';
  updateRedrawUI();
}

function updateRedrawUI() {
  const s = getSettings();
  const btn = document.getElementById('btn-redraw');
  const info = document.getElementById('redraw-info');
  if (s.redrawLimit > 0) {
    const left = Math.max(0, s.redrawLimit - redrawsUsed);
    btn.disabled = left === 0;
    info.textContent = current.solo
      ? '重抽剩余 ' + left + ' 次'
      : '重抽剩余 ' + left + ' 次 · 第 ' + (current.step + 1) + ' 轮（同房间号+同轮数=同结果）';
  } else {
    btn.disabled = false;
    info.textContent = current.solo
      ? '重抽不限次数'
      : '重抽不限次数 · 第 ' + (current.step + 1) + ' 轮（同房间号+同轮数=同结果）';
  }
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ---------- 事件 ---------- */
document.getElementById('btn-draw').addEventListener('click', () => {
  redrawsUsed = 0;
  if (doDraw(0)) render();
});
document.getElementById('btn-redraw').addEventListener('click', () => {
  const s = getSettings();
  if (s.redrawLimit > 0 && redrawsUsed >= s.redrawLimit) return;
  redrawsUsed++;
  if (doDraw(current.solo ? 0 : current.step + 1)) render();
});
document.getElementById('btn-room').addEventListener('click', () => {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  document.getElementById('room').value = code;
});
document.getElementById('btn-room-copy').addEventListener('click', () => {
  const v = document.getElementById('room').value.trim();
  if (!v) { toast('先点「生成」或手动输入房间号'); return; }
  copyText(v, '房间号已复制：' + v);
});
document.getElementById('btn-copy').addEventListener('click', () => {
  if (!current || !current.fields) { toast('还没有抽过'); return; }
  const s = getSettings();
  const list = current.fields.map(f => f.name + '(' + f.n + ')').join(' / ');
  const room = current.solo ? '独立随机' : ('房间号 ' + current.room);
  const round = current.solo ? '' : ' · 第 ' + (current.step + 1) + ' 轮';
  const text = '【游戏王抽字段】' + room + round + ' | 抽' + current.fields.length + '：' + list +
    ' | 卡数下限 ' + (s.min === 0 ? '不限' : '≥' + s.min);
  copyText(text, '战报已复制');
});
document.getElementById('btn-block').addEventListener('click', () => {
  const p = document.getElementById('block-panel');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
  renderBlocklist();
});
document.getElementById('block-add').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const v = e.target.value.trim();
  if (!v) return;
  const names = parseBlockText(v);
  const added = addBlock(names);
  if (added === 0) {
    const ok = names.every(n => FIELDS.some(f => f.name === n));
    toast(ok ? '这些字段已在屏蔽列表中' : '没有匹配到字段名（需与卡片上显示的名称完全一致）');
  } else {
    toast('已屏蔽 ' + added + ' 个字段');
  }
  e.target.value = '';
});
document.getElementById('btn-block-copy').addEventListener('click', () => {
  if (blocklist.size === 0) { toast('屏蔽列表为空'); return; }
  copyText([...blocklist].sort().join('、'), '屏蔽表已复制，发给朋友点「粘贴导入」即可同步');
});
document.getElementById('btn-block-paste').addEventListener('click', () => {
  const doImport = (text) => {
    const added = addBlock(parseBlockText(text));
    toast(added ? '导入并屏蔽 ' + added + ' 个字段' : '剪贴板里没有可识别的字段名');
  };
  if (navigator.clipboard && navigator.clipboard.readText) {
    navigator.clipboard.readText().then(doImport, () => toast('无法读取剪贴板，请粘贴到上方输入框后回车'));
  } else {
    toast('浏览器不支持读剪贴板，请粘贴到上方输入框后回车');
  }
});
document.getElementById('btn-block-clear').addEventListener('click', () => {
  if (blocklist.size === 0) return;
  if (confirm('确定清空全部 ' + blocklist.size + ' 个屏蔽字段？')) {
    blocklist.clear();
    saveBlocklist();
    renderBlocklist();
  }
});

loadSettings();
loadBlocklist();
updateBlockBtn();
</script>
</body>
</html>
